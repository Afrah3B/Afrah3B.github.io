<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portfolio of Afrah Bawhab, a Software Engineer who turns uncertainty into working software."
    />
    <meta property="og:title" content="Afrah Bawhab - Software Engineer" />
    <meta
      property="og:description"
      content="A warm editorial engineering portfolio focused on real products, ambiguity, and systems thinking."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <script>
      (() => {
        const stored = localStorage.getItem("afrah-theme");
        const systemDark = matchMedia("(prefers-color-scheme: dark)").matches;
        const theme = stored === "dark" || (stored !== "light" && systemDark) ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <title>Afrah Bawhab - Software Engineer</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
